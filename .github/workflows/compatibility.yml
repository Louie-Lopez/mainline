name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      MAINLINE_SCRIPT: plugin/skills/mainline/mainline.py
      PYTHONUTF8: "1"
      MAINLINE_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: State and service tests
        run: python -m unittest -q test_mainline test_branches test_recovery test_todos
      - name: Packaged runtime and detached startup
        run: python test_package_runtime.py
      - name: Install browser test dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Build static demos
        run: python build_demo.py
      - name: Offline demo interactions
        run: node test_demo.cjs
      - name: Packaged view interactions
        run: node test_browser.cjs
      - name: Packaged language and responsive views
        run: node test_languages.cjs
      - name: Packaged branch navigation and progress isolation
        run: node test_branches_browser.cjs
      - name: Show service diagnostics on failure
        if: failure()
        run: python -c "from pathlib import Path; files = [p for p in Path('.test-runs').rglob('*') if p.name.endswith(('.server.log', '.runtime.json'))]; [print(str(p) + '\n' + p.read_text(encoding='utf-8', errors='replace')) for p in files]"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            .test-runs/**/report.json
            .test-runs/**/runtime-report.json
            .test-runs/**/*.png
            .test-runs/**/*.server.log
            .test-runs/**/*.runtime.json
          include-hidden-files: true
          retention-days: 7
